
name: Build KYRUN SHOP APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract Android Project
        run: |
          ZIP=$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)
          if [ -z "$ZIP" ]; then
            echo "File ZIP proyek tidak ditemukan"
            exit 1
          fi
          mkdir -p android-project
          unzip -q "$ZIP" -d android-project

      - name: Build APK
        run: |
          GRADLEW=$(find android-project -type f -name gradlew -print -quit)
          if [ -z "$GRADLEW" ]; then
            echo "Gradle wrapper tidak ditemukan"
            exit 1
          fi
          ROOT=$(dirname "$GRADLEW")
          chmod +x "$GRADLEW"
          cd "$ROOT"
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KYRUN-SHOP-APK
          path: android-project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
